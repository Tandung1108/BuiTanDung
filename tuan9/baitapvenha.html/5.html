<script>
    // Bài 5: Tìm số lớn nhất trong 3 số
function timMax(a, b, c) {
    let max = a;
    if (b > max) {
        max = b;
    }
    if (c > max) {
        max = c;
    }
    return max;
}

console.log("--- TÌM SỐ LỚN NHẤT ---");
console.log("Số lớn nhất trong (5, 12, 9) là:", timMax(5, 12, 9)); // Kết quả: 12
</script>
