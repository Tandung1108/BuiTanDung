<script>
    // Phần 1: In ra dãy số từ 1 đến 100
console.log("--- Dãy số từ 1 đến 100 ---");
for (let i = 1; i <= 100; i++) {
    console.log(i);
}

// Phần 2: Chỉ in ra các số chẵn từ 1 đến 100
console.log("--- Dãy số chẵn từ 1 đến 100 ---");
for (let i = 1; i <= 100; i++) {
    if (i % 2 === 0) {
        console.log(i);
    }
}
</script>
