<script>
    // Bài 2: Tính tổng dãy số từ 1 đến n
function tinhTong(n) {
    let tong = 0;
    for (let i = 1; i <= n; i++) {
        tong += i;
    }
    return tong;
}

console.log("--- TÍNH TỔNG DÃY SỐ ---");
console.log("Tổng từ 1 đến 5 là:", tinhTong(5));   // Kết quả: 15
console.log("Tổng từ 1 đến 10 là:", tinhTong(10)); // Kết quả: 55
</script>
