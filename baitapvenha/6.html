<script>
    let a = Number(prompt("Nhập cạnh thứ nhất:"));
let b = Number(prompt("Nhập cạnh thứ hai:"));
let c = Number(prompt("Nhập cạnh thứ ba:"));

// Kiểm tra xem có tạo thành tam giác hợp lệ không trước, sau đó kiểm tra đều
if (a > 0 && b > 0 && c > 0 && (a + b > c) && (a + c > b) && (b + c > a)) {
    if (a === b && b === c) {
        console.log("Đây là tam giác đều.");
    } else {
        console.log("Đây là tam giác thường (hoặc dạng khác không phải tam giác đều).");
    }
} else {
    console.log("Ba cạnh nhập vào không tạo thành một tam giác hợp lệ!");
}
</script>
