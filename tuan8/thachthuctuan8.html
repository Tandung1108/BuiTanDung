<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Lời chào và Thời gian thực - DOM</title>
</head>
<body>

    <!-- Thẻ HTML có sẵn id="loichao" để DOM tìm và cập nhật nội dung -->
    <h1 id="loichao">Đang tải...</h1>

    <script>
        function capNhatThoiGianThuc() {
            // 1. Khởi tạo đối tượng Date để lấy thời gian hiện tại của hệ thống
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // 2. Phân loại lời chào theo buổi trong ngày
            let greeting = "";
            if (hours >= 5 && hours < 12) {
                greeting = "Chào buổi sáng!";
            } else if (hours >= 12 && hours < 18) {
                greeting = "Chào buổi chiều!";
            } else {
                greeting = "Chào buổi tối!";
            }

            // 3. Định dạng lại phút và giây luôn có 2 chữ số (ví dụ: 09 thay vì 9)
            const phut = minutes < 10 ? "0" + minutes : minutes;
            const giay = seconds < 10 ? "0" + seconds : seconds;
            const gio = hours < 10 ? "0" + hours : hours;

            // 4. Tổng hợp nội dung: Lời chào + Đồng hồ thời gian thực
            const noiDungHienThi = `${greeting} (Bây giờ là: ${gio}:${phut}:${giay})`;

            // 5. Sử dụng DOM để tìm thẻ id="loichao" và cập nhật nội dung
            const element = document.getElementById("loichao");
            if (element) {
                element.innerText = noiDungHienThi;
            }
        }

        // Chạy ngay khi trang vừa tải xong
        document.addEventListener("DOMContentLoaded", function() {
            capNhatThoiGianThuc(); // Gọi lần đầu tiên lập tức
            setInterval(capNhatThoiGianThuc, 1000); // Tự động cập nhật lại mỗi giây (1000ms) để đồng hồ chạy liên tục
        });
    </script>

</body>
</html>
