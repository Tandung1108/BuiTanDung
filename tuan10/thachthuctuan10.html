<!-- Nút mở Modal -->
<button id="openModalBtn">Mua hàng / Liên hệ</button>

<!-- Khung Modal (Mặc định ẩn đi bằng CSS display: none) -->
<div id="myModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
    <div style="background: white; padding: 20px; border-radius: 8px; width: 300px; position: relative;">
        <h3>Form Đăng Ký</h3>
        <input type="text" placeholder="Họ và tên" style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        <input type="email" placeholder="Email liên hệ" style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        <button id="submitBtn">Gửi thông tin</button>
        <!-- Nút đóng Modal -->
        <button id="closeModalBtn" style="margin-left: 10px; background: red; color: white; border: none; padding: 5px 10px; cursor: pointer;">Đóng</button>
    </div>
</div>

<script>
    const openBtn = document.getElementById('openModalBtn');
    const modal = document.getElementById('myModal');
    const closeBtn = document.getElementById('closeModalBtn');

    // Mở Modal (chuyển display thành flex)
    openBtn.addEventListener('click', function() {
        modal.style.display = 'flex';
    });

    // Đóng Modal khi bấm nút đóng
    closeBtn.addEventListener('click', function() {
        modal.style.display = 'none';
    });

    // Đóng Modal khi click ra vùng nền mờ bên ngoài
    window.addEventListener('click', function(event) {
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    });
</script>
