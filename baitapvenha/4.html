<script>
    // Khai báo tài khoản và mật khẩu cố định
let correctUser = "admin";
let correctPass = "123456";

// Lấy thông tin từ người dùng
let inputUser = prompt("Nhập tên đăng nhập:");
let inputPass = prompt("Nhập mật khẩu:");

// Kiểm tra điều kiện
if (inputUser === correctUser && inputPass === correctPass) {
    alert("Đăng nhập thành công!");
} else {
    alert("Thông tin không chính xác!");
}
</script>
